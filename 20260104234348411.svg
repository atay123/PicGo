<svg width="1200" height="510" viewBox="0 0 1200 510" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97757;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e89f85;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="5" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="510" fill="url(#bgGradient)" />

  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="300" fill="#d97757" opacity="0.05" />
  <circle cx="1100" cy="400" r="200" fill="#ffffff" opacity="0.03" />
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
  </pattern>
  <rect width="1200" height="510" fill="url(#grid)" />

  <!-- Main Content Container -->
  <g transform="translate(100, 80)">
    
    <!-- Title Text -->
    <text x="500" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="64" fill="#ffffff" text-anchor="middle" filter="url(#dropShadow)">
      Claude Code
    </text>
    <text x="500" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="64" fill="url(#accentGradient)" text-anchor="middle" filter="url(#dropShadow)">
      Transcripts
    </text>
     <text x="500" y="280" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" font-size="32" fill="#cccccc" text-anchor="middle" letter-spacing="4">
      对话记录可视化工具
    </text>

    <!-- Visual Metaphor: Code to HTML -->
    <!-- Left: Terminal Icon -->
    <g transform="translate(100, 100)" opacity="0.8">
      <rect x="0" y="0" width="160" height="120" rx="10" fill="#333" stroke="#555" stroke-width="2"/>
      <circle cx="20" cy="15" r="4" fill="#ff5f56"/>
      <circle cx="35" cy="15" r="4" fill="#ffbd2e"/>
      <circle cx="50" cy="15" r="4" fill="#27c93f"/>
      <rect x="15" y="35" width="80" height="8" rx="2" fill="#666"/>
      <rect x="15" y="55" width="110" height="8" rx="2" fill="#666"/>
      <rect x="15" y="75" width="90" height="8" rx="2" fill="#666"/>
      <text x="15" y="105" font-family="monospace" font-size="14" fill="#d97757">&gt;_</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(320, 150)">
      <path d="M0,0 L60,0 M50,-10 L60,0 L50,10" stroke="#666" stroke-width="4" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Right: Browser/HTML Icon -->
    <g transform="translate(740, 100)" opacity="0.9">
       <rect x="0" y="0" width="160" height="120" rx="5" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
       <rect x="0" y="0" width="160" height="25" rx="5" fill="#e0e0e0"/> 
       <!-- Fake URL bar -->
       <rect x="20" y="6" width="100" height="13" rx="6" fill="#fff"/>
       <!-- Content -->
       <rect x="20" y="40" width="40" height="40" rx="2" fill="#d97757" opacity="0.8"/>
       <rect x="70" y="45" width="70" height="8" rx="2" fill="#999"/>
       <rect x="70" y="60" width="50" height="8" rx="2" fill="#ccc"/>
       <rect x="20" y="90" width="120" height="8" rx="2" fill="#ccc"/>
    </g>

  </g>
  
  <!-- Footer/Author info -->
  <text x="1150" y="480" font-family="sans-serif" font-size="14" fill="#666" text-anchor="end">Based on simonw/claude-code-transcripts</text>

</svg>